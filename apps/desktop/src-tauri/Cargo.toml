[package]
name = "gather-desktop"
version = "0.1.1"
edition = "2021"
description = "Gather desktop UI (Tauri v2)"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
keyring = { version = "3", features = ["sync-secret-service", "vendored", "apple-native", "windows-native"] }

[lib]
name = "gather_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
