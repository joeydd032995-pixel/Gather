# Gather — single CI/CD workflow: lint, test, build (daemon + desktop),
# release artifacts. Desktop bundles build on Linux, Windows and macOS.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # release job attaches artifacts to tag releases

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- lint ----
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: rustfmt
        working-directory: daemon
        run: cargo fmt --check
      - name: clippy
        working-directory: daemon
        run: cargo clippy --all-targets -- -D warnings

  # --------------------------------------------------------------- audit ----
  # Dependency-vulnerability scanning. The daemon parses untrusted PDF/OCR/JSON
  # input, so a known-CVE crate is a hard gate; the desktop is a thin loopback
  # client, so its advisories report without blocking (Dependabot opens the
  # upgrade PRs — see .github/dependabot.yml).
  audit:
    name: audit (cargo-audit + npm audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: daemon
        run: cargo audit
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (advisory)
        working-directory: apps/desktop
        continue-on-error: true
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------- test ----
  test:
    name: test (unit + integration vs pgvector)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gather
          POSTGRES_USER: gather
          POSTGRES_PASSWORD: gather-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gather -d gather"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://gather:gather-ci@localhost:5432/gather
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: install tesseract (OCR integration tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: cargo test
        working-directory: daemon
        run: cargo test --all-targets

  # ------------------------------------------------------ restore drill ----
  # Tier-1 restore drill (docs/BACKUP-RUNBOOK.md): proves backup -> restore
  # -> import round-trips with no data loss, using synthetic data and a
  # throwaway local restic repo (no real credentials). Runs in its own job
  # with its own Postgres service container — scripts/ci-restore-drill.sh
  # does an unconditional TRUNCATE CASCADE, which would corrupt the `test`
  # job's shared, concurrently-used database if run there instead.
  restore-drill:
    name: restore drill (tier 1 — synthetic backup/restore round trip)
    runs-on: ubuntu-24.04
    needs: [lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gather
          POSTGRES_USER: gather
          POSTGRES_PASSWORD: gather-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gather -d gather"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://gather:gather-ci@localhost:5432/gather
      GATHER_RESTORE_DRILL_ALLOW_DESTRUCTIVE: "1"
      GATHER_DAEMON_BIN: daemon/target/debug/gather-daemon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: install restic + tesseract (OCR extraction path) + postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y restic tesseract-ocr tesseract-ocr-eng postgresql-client
      - name: build daemon (debug)
        working-directory: daemon
        run: cargo build --locked
      - name: run restore drill
        run: scripts/ci-restore-drill.sh

  # ------------------------------------------------------ graph benchmark ----
  # Tier 1: proves the harness still runs and catches gross traversal
  # regressions. It deliberately does NOT produce the go/no-go number — shared
  # CI runners are far too noisy for a defensible p95, and the scale here is a
  # fraction of the roadmap's >1M-row bar. The real figures come from a
  # full-scale run per docs/BENCHMARK-RUNBOOK.md, the same way
  # vps-restore-drill.sh is the real restore test.
  graph-benchmark:
    name: graph benchmark (tier 1 — traversal smoke)
    runs-on: ubuntu-24.04
    needs: [lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gather
          POSTGRES_USER: gather
          POSTGRES_PASSWORD: gather-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gather -d gather"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://gather:gather-ci@localhost:5432/gather
      GATHER_GRAPH_BENCH_ALLOW_DESTRUCTIVE: "1"
      GATHER_BENCH_ENTITIES: "5000"
      GATHER_BENCH_RELATIONSHIPS: "50000"
      GATHER_BENCH_ROOTS: "8"
      GATHER_BENCH_REPEATS: "2"
      GATHER_BENCH_DEPTHS: "1 2"
      GATHER_BENCH_TIMEOUT_MS: "10000"
      # Reporting only: a CI-runner p95 is not evidence about the 150 ms gate.
      GATHER_BENCH_ENFORCE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: apply migrations
        working-directory: daemon
        run: for f in migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: run graph benchmark
        run: scripts/graph-benchmark.sh

  # -------------------------------------------------------- build daemon ----
  build-daemon:
    name: build daemon (linux x86_64)
    runs-on: ubuntu-24.04
    needs: [lint, test, restore-drill, graph-benchmark]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: release build
        working-directory: daemon
        run: cargo build --release --locked
      - name: smoke-test binary starts and refuses non-loopback bind
        working-directory: daemon
        run: |
          set +e
          GATHER_BIND_ADDR=0.0.0.0:7601 DATABASE_URL=postgres://x@localhost/x \
            ./target/release/gather-daemon
          test $? -ne 0 # must exit non-zero without GATHER_ALLOW_NON_LOOPBACK
          GATHER_GRPC_BIND_ADDR=0.0.0.0:7602 DATABASE_URL=postgres://x@localhost/x \
            ./target/release/gather-daemon
          test $? -ne 0 # the gRPC listener obeys the same loopback guard
      - uses: actions/upload-artifact@v7
        with:
          name: gather-daemon-linux-x86_64
          path: daemon/target/release/gather-daemon
          if-no-files-found: error

  # ------------------------------------------------------- build desktop ----
  # One-download installers: each bundles the daemon (sidecar) and a
  # PostgreSQL + pgvector runtime compiled here from pinned sources
  # (scripts/bundle-postgres.*). Installers are unsigned unless the signing
  # secrets exist; see docs/RELEASING.md. Every signing step below is a no-op
  # without its secret, and signing secrets are only handed to builds of
  # release tags (v*): branch and PR builds never see them.
  build-desktop:
    name: build desktop (${{ matrix.platform }})
    needs: [lint, test, restore-drill, graph-benchmark]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
      HAS_APPLE_CERT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon
            apps/desktop/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: install Tauri Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      # --- bundled PostgreSQL + pgvector (cached per OS and script version) --
      - name: cache bundled PostgreSQL
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/resources/postgres
          key: pg-bundle-${{ matrix.platform }}-${{ hashFiles('scripts/bundle-postgres.sh', 'scripts/bundle-postgres.ps1') }}
      - name: build PostgreSQL + pgvector (linux/macos)
        if: steps.pg-cache.outputs.cache-hit != 'true' && matrix.platform != 'windows'
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then brew list openssl@3 >/dev/null || brew install openssl@3; fi
          scripts/bundle-postgres.sh
      - name: MSVC developer shell (windows)
        if: steps.pg-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: build PostgreSQL + pgvector (windows)
        if: steps.pg-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          pip install --quiet meson ninja
          choco install -y --no-progress winflexbison3 pkgconfiglite
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          scripts/bundle-postgres.ps1

      # --- daemon sidecar ----------------------------------------------------
      - name: build daemon sidecar
        shell: bash
        run: |
          cargo build --release --locked --manifest-path daemon/Cargo.toml
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "${{ matrix.platform }}" = windows ] && ext=".exe"
          mkdir -p apps/desktop/src-tauri/binaries dist-daemon
          cp "daemon/target/release/gather-daemon$ext" "apps/desktop/src-tauri/binaries/gather-daemon-$triple$ext"
          cp "daemon/target/release/gather-daemon$ext" "dist-daemon/gather-daemon$ext"

      # --- signing hooks (inactive until the secrets exist) -----------------
      - name: updater signing config
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          python3 - <<'PY' > apps/desktop/src-tauri/tauri.updater.conf.json
          import json, os
          print(json.dumps({
            "bundle": {"createUpdaterArtifacts": True},
            "plugins": {"updater": {
              "pubkey": os.environ["PUBKEY"],
              "endpoints": ["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"],
              "windows": {"installMode": "passive"},
            }},
          }))
          PY
          echo "TAURI_EXTRA_CONFIG=$TAURI_EXTRA_CONFIG --config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
      - name: macOS code signing + notarization
        if: matrix.platform == 'macos' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Tauri imports the certificate, signs and notarizes when these are set.
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
          done
      - name: Windows code signing
        if: matrix.platform == 'windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/src-tauri/tauri.windows-sign.conf.json
          "TAURI_EXTRA_CONFIG=$env:TAURI_EXTRA_CONFIG --config src-tauri/tauri.windows-sign.conf.json" >> $env:GITHUB_ENV

      # --- build -------------------------------------------------------------
      - name: npm install
        working-directory: apps/desktop
        run: npm ci
      - name: typecheck + frontend build
        working-directory: apps/desktop
        run: npm run build
      - name: tauri build
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.HAS_UPDATER_KEY == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.HAS_UPDATER_KEY == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        # TAURI_EXTRA_CONFIG is intentionally unquoted: zero or more --config pairs.
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json $TAURI_EXTRA_CONFIG
      - uses: actions/upload-artifact@v7
        with:
          name: gather-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: gather-daemon-${{ matrix.platform }}
          path: dist-daemon/*
          if-no-files-found: error

  # ------------------------------------------------------------- release ----
  release:
    name: release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-daemon, build-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: tag matches the app version
        run: |
          app=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          [ "v$app" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match tauri.conf.json version $app (see docs/RELEASING.md)"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: package standalone daemons
        run: |
          mkdir -p release
          for os in linux windows macos; do
            dir=artifacts/gather-daemon-$os
            if [ "$os" = windows ]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/release/gather-daemon-$os-x86_64.zip" gather-daemon.exe)
            else
              arch=x86_64; [ "$os" = macos ] && arch=aarch64
              chmod +x "$dir/gather-daemon"
              tar -C "$dir" -czf "release/gather-daemon-$os-$arch.tar.gz" gather-daemon
            fi
          done
          find artifacts/gather-desktop-* -type f -exec cp {} release/ \;
      - name: checksums + updater manifest
        run: python3 scripts/release-manifest.py release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
