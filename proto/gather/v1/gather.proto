// Gather — local gRPC API, v1.
//
// Served on 127.0.0.1 only (offline-by-default), mirroring the REST API for
// downstream agents and tools that prefer gRPC. Every message maps 1:1 to
// columns in daemon/migrations/0001_init.sql; field comments name the
// backing table.column.

syntax = "proto3";

package gather.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "gather/v1;gatherv1";

// ---------------------------------------------------------------------------
// Shared enums (mirror Postgres enum types)
// ---------------------------------------------------------------------------

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_CHAT_EXPORT = 1;
  ARTIFACT_KIND_AGENT_LOG = 2;
  ARTIFACT_KIND_DOCUMENT_PDF = 3;
  ARTIFACT_KIND_DOCUMENT_MARKDOWN = 4;
  ARTIFACT_KIND_DOCUMENT_TEXT = 5;
  ARTIFACT_KIND_IMAGE_PHOTO = 6;
  ARTIFACT_KIND_IMAGE_SCREENSHOT = 7;
}

enum UnitKind {
  UNIT_KIND_UNSPECIFIED = 0;
  UNIT_KIND_FACT = 1;
  UNIT_KIND_CLAIM = 2;
  UNIT_KIND_DECISION = 3;
  UNIT_KIND_PREFERENCE = 4;
  UNIT_KIND_EVENT = 5;
}

enum UnitStatus {
  UNIT_STATUS_UNSPECIFIED = 0;
  UNIT_STATUS_ACTIVE = 1;
  UNIT_STATUS_SUPERSEDED = 2;
  UNIT_STATUS_RETRACTED = 3;
  UNIT_STATUS_DISPUTED = 4;
}

enum ContradictionStatus {
  CONTRADICTION_STATUS_UNSPECIFIED = 0;
  CONTRADICTION_STATUS_OPEN = 1;
  CONTRADICTION_STATUS_RESOLVED_A = 2;
  CONTRADICTION_STATUS_RESOLVED_B = 3;
  CONTRADICTION_STATUS_BOTH_VALID = 4;
  CONTRADICTION_STATUS_DISMISSED = 5;
}

// ---------------------------------------------------------------------------
// Core resources
// ---------------------------------------------------------------------------

message Artifact {
  string id = 1;                                   // artifacts.id (uuid)
  ArtifactKind kind = 2;                           // artifacts.kind
  string source_platform = 3;                      // artifacts.source_platform
  string source_format_version = 4;                // artifacts.source_format_version
  string original_filename = 5;                    // artifacts.original_filename
  string media_type = 6;                           // artifacts.media_type
  int64 byte_size = 7;                             // artifacts.byte_size
  string content_hash = 8;                         // artifacts.content_hash (sha-256 hex)
  int32 version = 9;                               // artifacts.version
  string supersedes_artifact_id = 10;              // artifacts.supersedes_artifact_id
  google.protobuf.Timestamp source_created_at = 11; // artifacts.source_created_at
  google.protobuf.Timestamp ingested_at = 12;      // artifacts.ingested_at
  google.protobuf.Struct metadata = 13;            // artifacts.metadata (jsonb)
}

message AtomicUnit {
  string id = 1;                                   // atomic_units.id
  UnitKind kind = 2;                               // atomic_units.kind
  string statement = 3;                            // atomic_units.statement
  float confidence = 4;                            // atomic_units.confidence
  string extraction_method = 5;                    // atomic_units.extraction_method
  string extraction_model = 6;                     // atomic_units.extraction_model
  google.protobuf.Timestamp valid_from = 7;        // atomic_units.valid_from
  google.protobuf.Timestamp valid_to = 8;          // atomic_units.valid_to
  UnitStatus status = 9;                           // atomic_units.status
  string subject_entity_id = 10;                   // atomic_units.subject_entity_id
  string superseded_by_unit_id = 11;               // atomic_units.superseded_by_unit_id
  repeated Provenance provenance = 12;             // atomic_unit_provenance rows
}

message Provenance {
  string artifact_id = 1;                          // atomic_unit_provenance.artifact_id
  ArtifactKind artifact_kind = 2;                  // artifacts.kind (joined)
  string source_platform = 3;                      // artifacts.source_platform (joined)
  string message_id = 4;                           // atomic_unit_provenance.message_id
  string document_segment_id = 5;                  // atomic_unit_provenance.document_segment_id
  string image_id = 6;                             // atomic_unit_provenance.image_id
  int32 char_start = 7;                            // atomic_unit_provenance.char_start
  int32 char_end = 8;                              // atomic_unit_provenance.char_end
  string quote = 9;                                // atomic_unit_provenance.quote
}

message Entity {
  string id = 1;                                   // entities.id
  string name = 2;                                 // entities.name
  string kind = 3;                                 // entities.kind
  string description = 4;                          // entities.description
}

message Relationship {
  string id = 1;                                   // relationships.id
  string source_entity_id = 2;                     // relationships.source_entity_id
  string target_entity_id = 3;                     // relationships.target_entity_id
  string relation_type = 4;                        // relationships.relation_type
  float confidence = 5;                            // relationships.confidence
  int32 depth = 6;                                 // entity_neighborhood(...) result depth
}

message Contradiction {
  string id = 1;                                   // contradictions.id
  AtomicUnit unit_a = 2;                           // joined via contradictions.unit_a_id
  AtomicUnit unit_b = 3;                           // joined via contradictions.unit_b_id
  float score = 4;                                 // contradictions.score
  string detection_method = 5;                     // contradictions.detection_method
  string explanation = 6;                          // contradictions.explanation
  ContradictionStatus status = 7;                  // contradictions.status
  google.protobuf.Timestamp detected_at = 8;       // contradictions.detected_at
  google.protobuf.Timestamp resolved_at = 9;       // contradictions.resolved_at
  string resolved_by = 10;                         // contradictions.resolved_by
  string resolution_note = 11;                     // contradictions.resolution_note
}

// ---------------------------------------------------------------------------
// IngestService — mirrors POST /api/v1/ingest/*
// ---------------------------------------------------------------------------

service IngestService {
  // Chat export from any platform (chatgpt | claude | generic schema).
  rpc IngestChatExport(IngestChatExportRequest) returns (IngestResponse);
  // Agent/session JSONL logs (claude_code | goose | aider | generic).
  rpc IngestAgentLog(IngestAgentLogRequest) returns (IngestResponse);
  // Manual file upload, client-streamed in chunks (documents and images).
  rpc IngestFile(stream IngestFileChunk) returns (IngestFileResponse);
}

message IngestChatExportRequest {
  string platform = 1;                             // -> artifacts.source_platform
  bytes data_json = 2;                             // raw export JSON bytes
  string filename = 3;                             // -> artifacts.original_filename
}

message IngestAgentLogRequest {
  string platform = 1;
  string jsonl = 2;
  string session_id = 3;
  string title = 4;
}

message IngestResponse {
  string job_id = 1;                               // ingestion_jobs.id
  string artifact_id = 2;                          // artifacts.id
  bool deduplicated = 3;                           // content_hash matched existing row
  int32 conversations = 4;                         // conversations rows created
  int32 messages = 5;                              // messages rows created
}

message IngestFileChunk {
  // First chunk must carry meta; subsequent chunks carry data only.
  message Meta {
    string filename = 1;                           // -> artifacts.original_filename
    string media_type = 2;                         // -> artifacts.media_type
    ArtifactKind kind_override = 3;                // optional explicit kind
  }
  oneof payload {
    Meta meta = 1;
    bytes data = 2;
  }
}

message IngestFileResponse {
  string job_id = 1;
  string artifact_id = 2;
  ArtifactKind kind = 3;
  bool deduplicated = 4;
  int32 segments = 5;                              // document_segments rows created
}

// ---------------------------------------------------------------------------
// QueryService — mirrors GET /api/v1/{artifacts,atomic-units,entities}/…
// ---------------------------------------------------------------------------

service QueryService {
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc GetArtifact(GetArtifactRequest) returns (Artifact);
  rpc ListAtomicUnits(ListAtomicUnitsRequest) returns (ListAtomicUnitsResponse);
  rpc GetEntityGraph(GetEntityGraphRequest) returns (GetEntityGraphResponse);
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);
}

message ListArtifactsRequest {
  ArtifactKind kind = 1;                           // filter on artifacts.kind
  string source_platform = 2;                      // filter on artifacts.source_platform
  int32 limit = 3;
  int32 offset = 4;
}

message ListArtifactsResponse {
  repeated Artifact items = 1;
}

message GetArtifactRequest {
  string id = 1;
}

message ListAtomicUnitsRequest {
  UnitKind kind = 1;
  UnitStatus status = 2;
  string subject_entity_id = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListAtomicUnitsResponse {
  repeated AtomicUnit items = 1;
}

message GetEntityGraphRequest {
  string entity_id = 1;                            // entities.id (root)
  int32 depth = 2;                                 // entity_neighborhood(max_depth), 1..5
  int32 max_edges = 3;                             // 0 = server default; capped server-side
}

message GetEntityGraphResponse {
  Entity root = 1;
  repeated Entity nodes = 2;
  repeated Relationship edges = 3;
  uint64 query_ms = 4;
  // A hub's 2-hop neighbourhood can be most of the graph, so the walk is
  // bounded and may return a partial answer. Added fields, so existing clients
  // stay wire-compatible; they simply read false/0.
  bool truncated = 5;
  int32 max_edges = 6;                             // cap actually applied
}

message SemanticSearchRequest {
  string text = 1;                                 // full-text (websearch) query
  repeated float embedding = 2;                    // 768-dim vector, optional
  string scope = 3;                                // atomic_units | messages | document_segments
  int32 limit = 4;
}

message SemanticSearchResponse {
  message Hit {
    string id = 1;
    string scope = 2;
    string content = 3;
    double score = 4;                              // cosine similarity or ts_rank
    string artifact_id = 5;
  }
  repeated Hit hits = 1;
}

// ---------------------------------------------------------------------------
// ContradictionService — mirrors /api/v1/contradictions/…
// ---------------------------------------------------------------------------

service ContradictionService {
  rpc ListContradictions(ListContradictionsRequest) returns (ListContradictionsResponse);
  rpc GetContradiction(GetContradictionRequest) returns (Contradiction);
  rpc ResolveContradiction(ResolveContradictionRequest) returns (Contradiction);
  rpc AnnotateContradiction(AnnotateContradictionRequest) returns (AnnotateContradictionResponse);
}

message ListContradictionsRequest {
  ContradictionStatus status = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListContradictionsResponse {
  repeated Contradiction items = 1;
}

message GetContradictionRequest {
  string id = 1;
}

message ResolveContradictionRequest {
  string id = 1;
  ContradictionStatus resolution = 2;              // RESOLVED_A/RESOLVED_B/BOTH_VALID/DISMISSED
  string note = 3;                                 // -> contradictions.resolution_note + audit
  string actor = 4;                                // -> contradictions.resolved_by
}

message AnnotateContradictionRequest {
  string id = 1;
  string note = 2;                                 // -> contradiction_audit.note
  string actor = 3;
}

message AnnotateContradictionResponse {
  string audit_id = 1;                             // contradiction_audit.id
}

// ---------------------------------------------------------------------------
// ExportService — mirrors GET /api/v1/export, POST /api/v1/import
// ---------------------------------------------------------------------------

service ExportService {
  // Streams the gather-bundle-v1 NDJSON document, chunked.
  rpc ExportBundle(ExportBundleRequest) returns (stream BundleChunk);
  // Accepts a chunked gather-bundle-v1 NDJSON document.
  rpc ImportBundle(stream BundleChunk) returns (ImportBundleResponse);
}

message ExportBundleRequest {}

message BundleChunk {
  bytes data = 1;                                  // raw NDJSON bytes
}

message ImportBundleResponse {
  message TableCount {
    string table = 1;
    int64 in_bundle = 2;
    int64 inserted = 3;
  }
  repeated TableCount tables = 1;
}

// ---------------------------------------------------------------------------
// EntityService — mirrors GET/POST /api/v1/entities/…
//
// Entity resolution over gRPC: list entities, review suggested duplicates,
// merge them, dismiss a suggested pair, or add an alias directly. Merge,
// dismiss, and add-alias share the exact REST cores in crate::entities, so the
// two API surfaces cannot diverge in persistence semantics.
// ---------------------------------------------------------------------------

service EntityService {
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc ListMergeSuggestions(ListMergeSuggestionsRequest) returns (ListMergeSuggestionsResponse);
  rpc GetEntity(GetEntityRequest) returns (EntityDetail);
  rpc MergeEntities(MergeEntitiesRequest) returns (MergeOutcome);
  rpc DismissMergeSuggestion(DismissMergeSuggestionRequest) returns (DismissMergeSuggestionResponse);
  rpc AddAlias(AddAliasRequest) returns (AddAliasResponse);
}

message EntitySummary {
  string id = 1;                                   // entities.id
  string name = 2;                                 // entities.name
  string kind = 3;                                 // entities.kind
  string description = 4;                          // entities.description
  string merged_into_entity_id = 5;                // entities.merged_into_entity_id ("" = live)
  int64 alias_count = 6;                           // count(entity_aliases)
  int64 edge_count = 7;                            // count(relationships touching this entity)
  google.protobuf.Timestamp created_at = 8;        // entities.created_at
}

message EntityMergeAuditEntry {
  string action = 1;                               // entity_merge_audit.action (merge | dismiss)
  string actor = 2;                                // entity_merge_audit.actor
  string note = 3;                                 // entity_merge_audit.note
  string winner_entity_id = 4;                     // entity_merge_audit.winner_entity_id
  string loser_entity_id = 5;                      // entity_merge_audit.loser_entity_id
  google.protobuf.Timestamp created_at = 6;        // entity_merge_audit.created_at
}

message EntityDetail {
  string id = 1;
  string name = 2;
  string kind = 3;
  string description = 4;
  string merged_into_entity_id = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated string aliases = 7;                     // entity_aliases.alias
  repeated EntityMergeAuditEntry audit = 8;        // entity_merge_audit rows touching this entity
}

message SuggestedMerge {
  Entity a = 1;                                    // higher-degree / surviving candidate
  Entity b = 2;
  float score = 3;                                 // 0..1 similarity
  string method = 4;                               // rule:name-similarity | embedding:cosine
}

message MergeOutcome {
  string winner_id = 1;
  string loser_id = 2;
  string winner_name = 3;
  string loser_name = 4;
  uint64 aliases_added = 5;
  uint64 units_repointed = 6;
  uint64 units_requeued_for_scan = 7;
  uint64 relationships_repointed = 8;
  uint64 relationships_dropped = 9;
  uint64 descendants_flattened = 10;
}

message ListEntitiesRequest {
  string q = 1;                                    // case-insensitive substring on name
  string kind = 2;                                 // exact entities.kind filter
  int32 limit = 3;
  int32 offset = 4;
  bool include_merged = 5;                         // include merged-away entities
}

message ListEntitiesResponse {
  repeated EntitySummary items = 1;
}

message ListMergeSuggestionsRequest {
  float threshold = 1;                             // 0 = server default (entities::DEFAULT_THRESHOLD)
  int32 limit = 2;
}

message ListMergeSuggestionsResponse {
  repeated SuggestedMerge items = 1;
  float threshold = 2;                             // effective threshold applied
}

message GetEntityRequest {
  string id = 1;
}

message MergeEntitiesRequest {
  string winner_id = 1;                            // survives
  string loser_id = 2;                             // folded into winner
  string note = 3;
  string actor = 4;                                // "" -> local-user
}

message DismissMergeSuggestionRequest {
  string id = 1;
  string other_id = 2;
  string note = 3;
  string actor = 4;
}

message DismissMergeSuggestionResponse {}

message AddAliasRequest {
  string entity_id = 1;
  string alias = 2;
}

message AddAliasResponse {
  bool added = 1;                                  // false when the alias already existed
}

// ---------------------------------------------------------------------------
// FeedbackService — mirrors /api/v1/units/… and /api/v1/review/…
//
// The feedback loop and the optional review tray (autonomous pipeline). Every
// RPC calls the same core as its REST route, so labels, reversibility and
// tray semantics cannot diverge between the two API surfaces.
// ---------------------------------------------------------------------------

service FeedbackService {
  rpc RejectUnit(UnitActionRequest) returns (UnitActionResponse);
  rpc RestoreUnit(UnitActionRequest) returns (UnitActionResponse);
  rpc ConfirmUnit(UnitActionRequest) returns (UnitActionResponse);
  rpc EditUnit(EditUnitRequest) returns (UnitActionResponse);
  rpc ListReview(ListReviewRequest) returns (ListReviewResponse);
  rpc AcceptReview(ReviewActionRequest) returns (ReviewOutcome);
  rpc RejectReview(ReviewActionRequest) returns (ReviewOutcome);
  rpc ResolveReview(ReviewActionRequest) returns (ReviewOutcome);
}

message UnitActionRequest {
  string unit_id = 1;
  string note = 2;
}

message EditUnitRequest {
  string unit_id = 1;
  string statement = 2;
  string note = 3;
}

message UnitActionResponse {
  string unit_id = 1;
  string status = 2;                               // atomic_units.status after the action
  string statement = 3;                            // set by EditUnit
}

message ListReviewRequest {
  int32 limit = 1;                                 // 0 = 100
}

message ReviewEntry {
  string id = 1;                                   // review_queue.id
  string target_kind = 2;                          // unit | entity | merge | cluster
  string target_id = 3;
  string reason = 4;                               // low-confidence | merge-band | oversized-component
  float info_gain = 5;                             // tray priority, higher first
  google.protobuf.Struct signals = 6;              // the scores behind the hold
  string statement = 7;                            // unit items: the statement
  google.protobuf.Timestamp created_at = 8;
}

message ListReviewResponse {
  repeated ReviewEntry items = 1;
}

message ReviewActionRequest {
  string id = 1;                                   // review_queue.id
  string note = 2;
}

message ReviewOutcome {
  string id = 1;
  string action = 2;                               // confirmed | retracted | merged | dismissed | resolved
  string unit_id = 3;
  string winner_id = 4;                            // merged: the surviving entity
  string loser_id = 5;
  repeated string pair = 6;                        // dismissed merge pair
}

// ---------------------------------------------------------------------------
// ClusterService — mirrors GET /api/v1/clusters…
// ---------------------------------------------------------------------------

service ClusterService {
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc GetCluster(GetClusterRequest) returns (ClusterDetail);
}

message ListClustersRequest {
  string kind = 1;                                 // "" = all; entity | topic | photo_dup | album | photo_topic
  int32 limit = 2;                                 // 0 = 100
}

message ClusterSummary {
  string id = 1;
  string kind = 2;
  string label = 3;
  float cohesion = 4;
  int32 size = 5;
  string representative_id = 6;                    // "" when the kind has none
  google.protobuf.Timestamp updated_at = 7;
}

message ListClustersResponse {
  repeated ClusterSummary items = 1;
}

message GetClusterRequest {
  string id = 1;
}

message ClusterMember {
  string member_kind = 1;                          // entity | unit | image
  string member_id = 2;
  float sim = 3;
  string statement = 4;                            // unit members
  string filename = 5;                             // image members
  google.protobuf.Timestamp taken_at = 6;          // image members
  string caption = 7;                              // image members (opt-in captions)
}

message ClusterDetail {
  ClusterSummary summary = 1;
  google.protobuf.Timestamp created_at = 2;
  repeated ClusterMember members = 3;
}

// ---------------------------------------------------------------------------
// TuningService — mirrors /api/v1/tuning…
// ---------------------------------------------------------------------------

service TuningService {
  rpc GetTuning(GetTuningRequest) returns (TuningState);
  rpc ResetTuning(ResetTuningRequest) returns (ResetTuningResponse);
}

message GetTuningRequest {}

message TunedThreshold {
  string key = 1;                                  // admit.hold_below | merge.auto_single
  float value = 2;                                 // in force now
  float default_value = 3;                         // env default
  bool tuned = 4;                                  // learned from feedback
  float bound_min = 5;
  float bound_max = 6;
}

message TuningChange {
  string key = 1;
  optional double old_value = 2;
  optional double new_value = 3;                   // unset = reset to the env default
  string actor = 4;                                // auto-tuner | local-user
  google.protobuf.Struct reason = 5;               // evidence behind the move
  google.protobuf.Timestamp created_at = 6;
}

message TuningState {
  bool enabled = 1;
  float target_precision = 2;
  uint32 min_samples = 3;
  repeated TunedThreshold thresholds = 4;
  repeated TuningChange history = 5;
}

message ResetTuningRequest {
  string key = 1;                                  // "" = all keys
}

message ResetTuningResponse {
  repeated string reset = 1;
}

// ---------------------------------------------------------------------------
// PhotoService — mirrors GET /api/v1/images/{id}/thumbnail
//
// Duplicate groups, albums and visual topics are clusters (ClusterService).
// ---------------------------------------------------------------------------

service PhotoService {
  rpc GetThumbnail(GetThumbnailRequest) returns (Thumbnail);
}

message GetThumbnailRequest {
  string image_id = 1;
}

message Thumbnail {
  bytes data = 1;                                  // JPEG, <= 256 px on the long side
  string content_type = 2;                         // image/jpeg
}
